<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>TokenHub</title>
    <meta name="title" content="TokenHub" />
    <meta
      name="description"
      content="TokenHub — Unified AI API gateway and admin dashboard."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#110e1b" />
    <!-- Resolve the theme before first paint so the page never flashes
         and defaults to YedAgent's crisp light Neo-Brutalist canvas. -->
    <script>
      ;(function () {
        var theme = 'light'
        try {
          theme = localStorage.getItem('tokenhub:theme:v1:mode') || 'light'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
